# Самостоятельный файл, не overlay. Запускать ТОЛЬКО с --env-file .env.production.
name: dentflow-production

x-backend: &backend
  build: ./backend
  env_file: .env.production
  environment:
    APP_ENV: production
    ENABLE_DEV_TOOLS: 'false'
    COOKIE_SECURE: 'true'
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-dentflow}:${POSTGRES_PASSWORD:?Production DB password required}@postgres:5432/dentflow_production
    REDIS_URL: redis://redis:6379/0
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '5'

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dentflow_production
      POSTGRES_USER: ${POSTGRES_USER:-dentflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Production DB password required}
      TZ: Europe/Moscow
    volumes:
      - production-postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d dentflow_production']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes', --maxmemory, 256mb, --maxmemory-policy, noeviction]
    volumes:
      - production-redis:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  migrate:
    <<: *backend
    command: [alembic, upgrade, head]
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
  backend:
    <<: *backend
    command: [uvicorn, app.main:app, --host, 0.0.0.0, --port, '8000', --proxy-headers, --forwarded-allow-ips, '*', --no-access-log]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
  worker:
    <<: *backend
    command: [python, -m, app.worker]
    healthcheck:
      test: [CMD, python, -c, "import redis; from app.config import settings; assert redis.Redis.from_url(settings.redis_url).get('dentflow:worker:last_tick')"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 40s
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
  telegram:
    <<: *backend
    profiles: [telegram]
    command: [python, -m, app.telegram_bot]
    healthcheck:
      disable: true
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: '1'
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
  gateway:
    image: nginx:1.28-alpine
    ports:
      - '127.0.0.1:${HTTP_PORT:-8080}:8080'
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  production-postgres:
  production-redis:
