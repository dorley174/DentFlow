name: Проверка DentFlow
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dentflow
          POSTGRES_PASSWORD: ci-only-random-fixture
          POSTGRES_DB: dentflow_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dentflow -d dentflow_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      APP_ENV: test
      ENABLE_DEV_TOOLS: 'true'
      DATABASE_URL: postgresql+psycopg://dentflow:ci-only-random-fixture@127.0.0.1:5432/dentflow_test
      SECRET_KEY: ci-only-secret-is-not-used-for-production-2026
      ALLOWED_ORIGINS: http://testserver,http://localhost:8080
      COOKIE_SECURE: 'false'
      AI_EXTERNAL_ENABLED: 'false'
      TELEGRAM_ENABLED: 'false'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: alembic upgrade head
      - run: pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/configure.py
      - run: docker compose config --quiet
      - run: docker compose build
      - run: docker compose up -d --wait --wait-timeout 300
      - run: curl --fail --retry 5 --retry-delay 2 http://localhost:8080/api/health
      - run: curl --fail http://localhost:8080/
      - if: always()
        run: docker compose logs --tail=100 backend frontend worker
      - if: always()
        run: docker compose down
